name: Android CI

on:
  push:
    branches: [ main, master, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.3.2 — a single trailing letter (v1.3.2a) publishes a pre-release'
        required: true
        type: string

jobs:

  # Single source of truth for "is this a release, and which version is it".
  #
  # On workflow_dispatch this also bumps app/build.gradle, commits it to master
  # and tags that commit, so the release job below builds the tagged bump commit
  # within this same run. It has to happen in one run: a tag pushed with
  # GITHUB_TOKEN cannot start a new workflow run, so there is no second,
  # tag-triggered run to fall back on. Pushing a v* tag by hand still works
  # exactly as before, tests and all.
  release-context:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the version bump commit and the release tag
    outputs:
      release: ${{ steps.context.outputs.release }}
      tag: ${{ steps.context.outputs.tag }}
      run_tests: ${{ steps.context.outputs.run_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A dispatch can be started from any ref, but releases always come off
          # master. fetch-tags so the "already released?" checks can see them.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate requested version
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The checkout above swaps in master's *contents*, but GitHub already
          # picked this workflow's definition from the ref chosen in the Run
          # workflow UI. Releasing from anywhere else would run that ref's
          # release logic — with contents:write — against master's code.
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Releases must be dispatched from master, not ${GITHUB_REF#refs/heads/}."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)[a-z]?$ ]]; then
            echo "::error::'$TAG' is not a valid version. Expected vMAJOR.MINOR.PATCH, optionally with one trailing lowercase letter for a beta — e.g. v1.3.2 or v1.3.2a."
            exit 1
          fi
          # Refuse if a GitHub Release already exists for this version, whether or
          # not its tag does. A release outlives a deleted tag, and either path
          # would then hand it to action-gh-release, which overwrites by default
          # and would replace already-published artefacts with a fresh build.
          # Only 404 proves absence; anything inconclusive refuses.
          release_state="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" || echo 000)"
          case "$release_state" in
            404) ;;
            200)
              echo "::error::A GitHub Release already exists for $TAG. Delete it (and the tag, if you want to re-cut the same version) before re-running, or choose a version that has not been released."
              exit 1 ;;
            *)
              echo "::error::Could not determine whether $TAG already has a published release (HTTP $release_state). Refusing rather than risk overwriting published artefacts."
              exit 1 ;;
          esac

          # An existing tag means a previous run bumped and pushed but failed
          # later on; that is resumable. Judge it by what the tag *contains*,
          # not by where master is now — master may have moved on since, and
          # the release job checks out the tag rather than the branch anyway.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # A tag can be created from anywhere. Releases come off master, and
            # resuming skips the tests, so an unreachable tag would publish a
            # commit that was never on master and was never tested.
            if ! git merge-base --is-ancestor "refs/tags/$TAG^{commit}" HEAD; then
              echo "::error::Tag $TAG is not reachable from master — releases must come from master."
              exit 1
            fi
            # Only the newest release is resumable. Re-running an older one would
            # reuse the current versionCode and drag the release attachments back
            # to a superseded build. Ordered by creation date, not version
            # magnitude, so a deliberate downgrade is still resumable.
            newest="$(git for-each-ref --merged HEAD --sort=-creatordate \
                      --format='%(refname:strip=2)' 'refs/tags/v*' \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+[a-z]?$' | head -1)"
            if [ "$newest" != "$TAG" ]; then
              echo "::error::Tag $TAG is not the most recently cut release ($newest) — only the latest release can be resumed. Delete the tag and its GitHub Release, then re-dispatch, or cut a new version."
              exit 1
            fi
            # Extract and compare as a string: interpolating the version into a
            # regex would let its dots match any character.
            tagged_version="$(git show "$TAG:app/build.gradle" 2>/dev/null \
              | sed -nE 's/^[[:space:]]*versionName "(.*)"[[:space:]]*$/\1/p' | head -1)"
            if [ "$tagged_version" != "${TAG#v}" ]; then
              echo "::error::Tag $TAG already exists but its commit records versionName '$tagged_version', not '${TAG#v}' — pick a version that has not been released."
              exit 1
            fi
            echo "::notice::Tag $TAG already exists and carries version ${TAG#v}; resuming a previous release run without re-tagging."
            echo "RELEASE_RESUME=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_RESUME=false" >> "$GITHUB_ENV"
          fi

      - name: Bump version, commit and tag
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_RESUME != 'true'
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          # versionCode must increase monotonically or Android refuses the upgrade.
          current_code="$(sed -nE 's/^[[:space:]]*versionCode ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle | head -1)"
          if [ -z "$current_code" ]; then
            echo "::error::Could not read versionCode from app/build.gradle."
            exit 1
          fi
          next_code=$((current_code + 1))
          # Keep the original indentation rather than assuming a column.
          sed -i -E "s/^([[:space:]]*)versionCode [0-9]+[[:space:]]*$/\1versionCode ${next_code}/" app/build.gradle
          sed -i -E "s/^([[:space:]]*)versionName \".*\"[[:space:]]*$/\1versionName \"${version}\"/" app/build.gradle

          # Fail loudly rather than releasing an unbumped build. Compare the
          # extracted values literally.
          got_name="$(sed -nE 's/^[[:space:]]*versionName "(.*)"[[:space:]]*$/\1/p' app/build.gradle | head -1)"
          got_code="$(sed -nE 's/^[[:space:]]*versionCode ([0-9]+)[[:space:]]*$/\1/p' app/build.gradle | head -1)"
          [ "$got_name" = "$version" ] || {
            echo "::error::Failed to set versionName to ${version} in app/build.gradle (got '$got_name')."
            exit 1
          }
          [ "$got_code" = "$next_code" ] || {
            echo "::error::Failed to increment versionCode to ${next_code} in app/build.gradle (got '$got_code')."
            exit 1
          }
          grep -nE '^[[:space:]]*(versionCode|versionName) ' app/build.gradle

          # Attribute the bump to the repo owner, matching every other hand-made
          # commit here, rather than to the Actions bot.
          git config user.name 'Robin Jacobs'
          git config user.email 'RobinJ1995@users.noreply.github.com'
          git add app/build.gradle
          # Re-releasing a version already present in the file is a no-op
          # commit-wise; the tag still needs to land on master's tip.
          git diff --cached --quiet || git commit -m "$TAG"
          git tag -a "$TAG" -m "$TAG"
          # --atomic: either both refs land or neither does. A half-push would
          # leave master bumped but unreleased, and the GITHUB_TOKEN branch push
          # starts no CI run that would make that visible.
          git push --atomic origin HEAD:master "refs/tags/$TAG"

      - name: Resolve release context
        id: context
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Nothing about the code changed, so the tests that already passed on
            # master still hold — go straight to building the release.
            printf 'release=true\ntag=%s\nrun_tests=false\n' "$TAG" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            printf 'release=true\ntag=%s\nrun_tests=true\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            printf 'release=false\ntag=\nrun_tests=true\n' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: release-context
    if: needs.release-context.outputs.run_tests == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  unit-tests:
    needs: release-context
    if: needs.release-context.outputs.run_tests == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run unit tests and coverage
        run: ./gradlew jacocoTestReport

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: app/build/reports/jacoco/jacocoTestReport/

  # Build signed APK + AAB on version tags (v*), gated on the build + unit tests.
  release:
    if: >-
      ${{ !cancelled() && !failure()
      && needs.release-context.outputs.release == 'true' }}
    needs: [ release-context, build, unit-tests ]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create/attach the GitHub Release on tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.release-context.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Require signing secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to build a release without the keystore."
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # PKCS12 uses one password for both the store and the key entry.
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$STORE_PASSWORD"
          } > key.properties

      - name: Set release artifact version
        run: echo "RELEASE_VERSION=${{ needs.release-context.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify APK is release-signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Stage release APK and AAB
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifacts"
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/release-artifacts/Base64-$RELEASE_VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "$RUNNER_TEMP/release-artifacts/Base64-$RELEASE_VERSION.aab"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: base64-release-android
          path: |
            ${{ runner.temp }}/release-artifacts/Base64-${{ env.RELEASE_VERSION }}.apk
            ${{ runner.temp }}/release-artifacts/Base64-${{ env.RELEASE_VERSION }}.aab

      - name: Detect release type
        id: release_metadata
        run: |
          if [[ "$RELEASE_VERSION" =~ [[:alpha:]]$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<RELEASE_BODY"
              echo "> [!WARNING]"
              echo "> Test version, not a stable release"
              echo "RELEASE_BODY"
            } >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "body=" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-context.outputs.tag }}
          prerelease: ${{ steps.release_metadata.outputs.prerelease }}
          append_body: true
          body: ${{ steps.release_metadata.outputs.body }}
          files: |
            ${{ runner.temp }}/release-artifacts/Base64-${{ env.RELEASE_VERSION }}.apk
            ${{ runner.temp }}/release-artifacts/Base64-${{ env.RELEASE_VERSION }}.aab

      - name: Clean up secrets
        if: always()
        run: rm -f key.properties "$RUNNER_TEMP/upload-keystore.jks"
